<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil — Banco Lupita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --azul-banco: #0d47a1;
            --azul-claro: #1565c0;
            --verde:      #2e7d32;
            --rojo:       #c62828;
        }

        body {
            background-color: #f0f4f8;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ── Navbar ── */
        .navbar-banco {
            background: linear-gradient(135deg, var(--azul-banco), var(--azul-claro));
            padding: 14px 24px;
        }
        .navbar-banco .brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: .5px;
        }
        .navbar-banco .usuario-info {
            color: rgba(255,255,255,.85);
            font-size: .9rem;
        }
        .btn-cerrar {
            background: rgba(255,255,255,.15);
            border: 1px solid rgba(255,255,255,.4);
            color: #fff;
            font-size: .85rem;
            border-radius: 20px;
            padding: 4px 14px;
            text-decoration: none;
            transition: background .2s;
        }
        .btn-cerrar:hover { background: rgba(255,255,255,.3); color: #fff; }

        /* ── Avatar ── */
        .avatar-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--azul-banco), #1976d2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.4rem;
            color: #fff;
            font-weight: 700;
            flex-shrink: 0;
        }

        /* ── Tarjeta principal ── */
        .card-perfil {
            border: none;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,.09);
        }

        /* ── Filas de datos ── */
        .dato-fila {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .dato-fila:last-child { border-bottom: none; }

        .dato-icono {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }
        .icono-email    { background: #e3f2fd; color: #1565c0; }
        .icono-telefono { background: #e8f5e9; color: #2e7d32; }
        .icono-dir      { background: #fff3e0; color: #e65100; }
        .icono-fecha    { background: #f3e5f5; color: #7b1fa2; }

        .dato-label {
            font-size: .75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 2px;
        }
        .dato-valor {
            font-size: 1rem;
            font-weight: 500;
            color: #1a1a2e;
            word-break: break-word;
        }

        /* ── Banner de cabecera ── */
        .banner-perfil {
            background: linear-gradient(135deg, var(--azul-banco), #1976d2);
            border-radius: 16px 16px 0 0;
            padding: 32px 28px 24px;
            color: #fff;
        }

        /* ── Spinner ── */
        #spinner-perfil {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }

        /* ── Alertas ── */
        #alerta-global {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            max-width: 400px;
        }

        /* ── Badge miembro ── */
        .badge-miembro {
            background: rgba(255,255,255,.2);
            border: 1px solid rgba(255,255,255,.35);
            color: #fff;
            font-size: .75rem;
            border-radius: 20px;
            padding: 3px 12px;
            display: inline-block;
            margin-top: 6px;
        }

        @media (max-width: 576px) {
            .navbar-banco { padding: 12px 16px; }
            .avatar-circle { width: 70px; height: 70px; font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<!-- ═══════════ NAVBAR ═══════════ -->
<nav class="navbar-banco d-flex align-items-center justify-content-between">
    <div>
        <div class="brand">🏦 Banco Lupita</div>
        <div class="usuario-info" id="nav-usuario">Cargando...</div>
    </div>
    <div class="d-flex flex-wrap gap-2">
        <a href="dashboard.html" class="btn-cerrar">
            <i class="bi bi-house me-1"></i>Inicio
        </a>
        <a href="cuentas.html" class="btn-cerrar">
            <i class="bi bi-wallet2 me-1"></i>Mis cuentas
        </a>
        <a href="account.html" class="btn-cerrar">
            <i class="bi bi-plus-circle me-1"></i>Nueva cuenta
        </a>
        <button class="btn-cerrar" onclick="cerrarSesion()">
            <i class="bi bi-box-arrow-right me-1"></i>Salir
        </button>
    </div>
</nav>

<!-- ═══════════ ALERTA GLOBAL ═══════════ -->
<div id="alerta-global"></div>

<!-- ═══════════ CONTENIDO ═══════════ -->
<div class="container py-4" style="max-width: 720px;">

    <div class="card-perfil">

        <!-- Spinner mientras carga -->
        <div id="spinner-perfil">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="text-muted mt-2 small">Cargando perfil...</div>
            </div>
        </div>

        <!-- Contenido real (oculto hasta cargar) -->
        <div id="contenido-perfil" style="display:none;">

            <!-- Banner superior con avatar y nombre -->
            <div class="banner-perfil d-flex align-items-center gap-4">
                <div class="avatar-circle" id="avatar-iniciales">?</div>
                <div>
                    <div style="font-size:.8rem; opacity:.7; text-transform:uppercase; letter-spacing:.5px;">Mi perfil</div>
                    <div style="font-size:1.6rem; font-weight:700; line-height:1.2;" id="perfil-nombre-completo">—</div>
                    <div class="badge-miembro">
                        <i class="bi bi-shield-check me-1"></i>
                        Miembro desde <span id="perfil-fecha">—</span>
                    </div>
                </div>
            </div>

            <!-- Datos personales -->
            <div class="p-4">
                <div class="d-flex align-items-center justify-content-between mb-3">
                    <h6 class="fw-bold mb-0" style="color:#1a1a2e;">
                        <i class="bi bi-person-lines-fill me-2 text-primary"></i>Datos personales
                    </h6>
                    <span class="badge bg-success-subtle text-success" style="font-size:.72rem; border-radius:20px; padding:4px 10px;">
                        <i class="bi bi-lock-fill me-1"></i>Solo lectura
                    </span>
                </div>

                <!-- Email -->
                <div class="dato-fila">
                    <div class="dato-icono icono-email">
                        <i class="bi bi-envelope-fill"></i>
                    </div>
                    <div>
                        <div class="dato-label">Correo electrónico</div>
                        <div class="dato-valor" id="perfil-email">—</div>
                    </div>
                </div>

                <!-- Teléfono -->
                <div class="dato-fila">
                    <div class="dato-icono icono-telefono">
                        <i class="bi bi-telephone-fill"></i>
                    </div>
                    <div>
                        <div class="dato-label">Teléfono</div>
                        <div class="dato-valor" id="perfil-telefono">—</div>
                    </div>
                </div>

                <!-- Dirección -->
                <div class="dato-fila">
                    <div class="dato-icono icono-dir">
                        <i class="bi bi-geo-alt-fill"></i>
                    </div>
                    <div>
                        <div class="dato-label">Dirección</div>
                        <div class="dato-valor" id="perfil-direccion">—</div>
                    </div>
                </div>

                <!-- Fecha de registro -->
                <div class="dato-fila">
                    <div class="dato-icono icono-fecha">
                        <i class="bi bi-calendar-check-fill"></i>
                    </div>
                    <div>
                        <div class="dato-label">Fecha de registro</div>
                        <div class="dato-valor" id="perfil-fecha-registro">—</div>
                    </div>
                </div>

            </div><!-- /p-4 -->

            <!-- Pie de tarjeta -->
            <div class="px-4 pb-4">
                <div class="alert alert-info mb-0 d-flex align-items-start gap-2" style="border-radius:12px; font-size:.85rem;">
                    <i class="bi bi-info-circle-fill mt-1 flex-shrink-0"></i>
                    <span>Para actualizar tus datos, contacta a un asesor del banco en sucursal o al <strong>800-LUPITA-1</strong>.</span>
                </div>
            </div>

        </div><!-- /contenido-perfil -->
    </div><!-- /card-perfil -->

</div>

<script>
    // ── Sesión ────────────────────────────────────────────
    const sesion = {
        usuarioId: localStorage.getItem('usuarioId'),
        nombre:    localStorage.getItem('nombre'),
    };

    if (!sesion.usuarioId || sesion.usuarioId === 'null') {
        window.location.href = 'frontend_login/login.html';
    }

    document.getElementById('nav-usuario').textContent = `Hola, ${sesion.nombre || 'Usuario'}`;

    // ── Cargar perfil ──────────────────────────────────────
    async function cargarPerfil() {
        try {
            const res  = await fetch(`perfil.php?usuarioId=${sesion.usuarioId}`);
            const data = await res.json();

            if (!res.ok || data.error) {
                mostrarAlerta(data.error || 'No se pudo cargar el perfil.', 'danger');
                return;
            }

            const u = data.usuario;

            // Iniciales del avatar
            const iniciales = ((u.nombre?.[0] || '') + (u.apellidos?.[0] || '')).toUpperCase();
            document.getElementById('avatar-iniciales').textContent     = iniciales || '?';

            // Nombre completo
            document.getElementById('perfil-nombre-completo').textContent = `${u.nombre} ${u.apellidos}`;

            // Datos individuales
            document.getElementById('perfil-email').textContent          = u.email     || '—';
            document.getElementById('perfil-telefono').textContent       = u.telefono  || '—';
            document.getElementById('perfil-direccion').textContent      = u.direccion || '—';
            document.getElementById('perfil-fecha-registro').textContent = u.fecha_registro || '—';
            document.getElementById('perfil-fecha').textContent          = u.fecha_registro || '—';

            // Mostrar contenido, ocultar spinner
            document.getElementById('spinner-perfil').style.display  = 'none';
            document.getElementById('contenido-perfil').style.display = 'block';

        } catch (err) {
            mostrarAlerta('Error de conexión al cargar el perfil.', 'danger');
        }
    }

    // ── Alerta flotante ────────────────────────────────────
    function mostrarAlerta(msg, tipo = 'info') {
        const div = document.getElementById('alerta-global');
        div.innerHTML = `
            <div class="alert alert-${tipo} alert-dismissible shadow-sm" role="alert" style="border-radius:12px;">
                ${msg}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
        setTimeout(() => { div.innerHTML = ''; }, 5000);
    }

    // ── Cerrar sesión ──────────────────────────────────────
    function cerrarSesion() {
        localStorage.clear();
        window.location.href = 'frontend_login/login.html';
    }

    // ── Init ───────────────────────────────────────────────
    cargarPerfil();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
