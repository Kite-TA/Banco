<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Contraseña — Banco Lupita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,.1); }
        .card-header { background: linear-gradient(135deg, #0d47a1, #1565c0); border-radius: 16px 16px 0 0 !important; }

        /* Indicador de fortaleza */
        .strength-bar { height: 6px; border-radius: 3px; transition: all .3s; background: #e0e0e0; }
        .strength-bar.weak   { background: #ef5350; width: 33%; }
        .strength-bar.medium { background: #ffa726; width: 66%; }
        .strength-bar.strong { background: #66bb6a; width: 100%; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">

<div class="container" style="max-width: 440px">
    <div class="card">
        <div class="card-header text-white text-center py-4">
            <i class="bi bi-key fs-2 d-block mb-2"></i>
            <h5 class="mb-0 fw-bold">Nueva contraseña</h5>
            <small class="opacity-75">Elige una contraseña segura</small>
        </div>

        <div class="card-body p-4">

            <!-- Token inválido -->
            <div id="token-invalido" class="d-none text-center py-3">
                <i class="bi bi-x-circle-fill text-danger" style="font-size:3rem"></i>
                <h6 class="fw-bold mt-3">Enlace inválido o expirado</h6>
                <p class="text-muted small">Este enlace ya fue usado o expiró (validez 1 hora).</p>
                <a href="recuperar_password.html" class="btn btn-primary">
                    <i class="bi bi-arrow-repeat me-1"></i>Solicitar nuevo enlace
                </a>
            </div>

            <!-- Formulario -->
            <div id="formulario">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nueva contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" class="form-control"
                               placeholder="Mínimo 8 caracteres" oninput="evaluarFortaleza()">
                        <button class="btn btn-outline-secondary" type="button"
                                onclick="toggleVer('password', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="mt-2">
                        <div class="strength-bar" id="strength-bar"></div>
                        <small id="strength-text" class="text-muted"></small>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Confirmar contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="passwordConfirm" class="form-control"
                               placeholder="Repite la contraseña">
                        <button class="btn btn-outline-secondary" type="button"
                                onclick="toggleVer('passwordConfirm', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <button class="btn btn-primary w-100 py-2" onclick="cambiarPassword()">
                    <i class="bi bi-check2-circle me-1"></i>Establecer nueva contraseña
                </button>

                <div id="msg" class="mt-3"></div>
            </div>

            <!-- Éxito -->
            <div id="exito" class="d-none text-center py-3">
                <i class="bi bi-shield-check text-success" style="font-size:3rem"></i>
                <h6 class="fw-bold mt-3">¡Contraseña actualizada!</h6>
                <p class="text-muted small">Ya puedes iniciar sesión con tu nueva contraseña.</p>
                <a href="frontend_login/login.html" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Ir al inicio de sesión
                </a>
            </div>

        </div>
    </div>
</div>

<script>
// ── Leer token de la URL ─────────────────────────────────
const params = new URLSearchParams(window.location.search);
const token  = params.get('token') || '';

// Validar token al cargar la página
(async () => {
    if (!token) { mostrarTokenInvalido(); return; }

    try {
        const res  = await fetch(`recuperar_password.php?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!data.valido) mostrarTokenInvalido();
    } catch {
        mostrarTokenInvalido();
    }
})();

function mostrarTokenInvalido() {
    document.getElementById('formulario').classList.add('d-none');
    document.getElementById('token-invalido').classList.remove('d-none');
}

// ── Mostrar/ocultar contraseña ───────────────────────────
function toggleVer(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon  = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
    }
}

// ── Indicador de fortaleza ───────────────────────────────
function evaluarFortaleza() {
    const val  = document.getElementById('password').value;
    const bar  = document.getElementById('strength-bar');
    const txt  = document.getElementById('strength-text');
    bar.className = 'strength-bar';

    if (val.length === 0) { txt.textContent = ''; return; }

    let score = 0;
    if (val.length >= 8)              score++;
    if (/[A-Z]/.test(val))           score++;
    if (/[0-9]/.test(val))           score++;
    if (/[^A-Za-z0-9]/.test(val))    score++;

    if (score <= 1)      { bar.classList.add('weak');   txt.textContent = 'Débil'; }
    else if (score <= 2) { bar.classList.add('medium'); txt.textContent = 'Media'; }
    else                 { bar.classList.add('strong'); txt.textContent = 'Fuerte'; }
}

// ── Cambiar contraseña ───────────────────────────────────
async function cambiarPassword() {
    const password        = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('passwordConfirm').value;
    const msgDiv          = document.getElementById('msg');
    msgDiv.innerHTML = '';

    if (password.length < 8) {
        msgDiv.innerHTML = `<div class="alert alert-warning py-2">La contraseña debe tener al menos 8 caracteres.</div>`;
        return;
    }
    if (password !== passwordConfirm) {
        msgDiv.innerHTML = `<div class="alert alert-warning py-2">Las contraseñas no coinciden.</div>`;
        return;
    }

    const btn = event.currentTarget;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Guardando…';

    try {
        const res  = await fetch('reset_password.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password, passwordConfirm })
        });
        const data = await res.json();

        if (res.ok) {
            document.getElementById('formulario').classList.add('d-none');
            document.getElementById('exito').classList.remove('d-none');
        } else {
            msgDiv.innerHTML = `<div class="alert alert-danger py-2">${data.error}</div>`;
            if (data.error.includes('expiró')) mostrarTokenInvalido();
        }
    } catch {
        msgDiv.innerHTML = `<div class="alert alert-danger py-2">Error de conexión. Intenta de nuevo.</div>`;
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i>Establecer nueva contraseña';
    }
}
</script>
</body>
</html>
