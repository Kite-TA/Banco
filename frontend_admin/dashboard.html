<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard — Banco</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Panel de Administrador</h4>
    <div>
      <button id="btn-logout" class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
    </div>
  </div>

  <div class="row mb-3">
    <div class="col-md-4"><input id="q" class="form-control" placeholder="Buscar por nombre o email"></div>
    <div class="col-md-3">
      <select id="estado" class="form-select">
        <option value="all">Todos</option>
        <option value="active">Activos</option>
        <option value="inactive">Inactivos</option>
      </select>
    </div>
    <div class="col-md-2"><button id="btn-buscar" class="btn btn-primary">Filtrar</button></div>
  </div>

  <div id="tabla-contenedor" class="table-responsive">
    <table class="table table-striped">
      <thead><tr><th>Id</th><th>Nombre</th><th>Email</th><th>Tel</th><th>Registro</th><th>Activo</th><th>Acciones</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- Modal detalles -->
  <div class="modal fade" id="modalUser" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Detalles de usuario</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button></div>
      </div>
    </div>
  </div>

</div>
<script>
if (!localStorage.getItem('adminLogged')) location.href = 'login.html';

document.getElementById('btn-logout').addEventListener('click', ()=>{ localStorage.removeItem('adminLogged'); location.href='login.html'; });

async function cargar(){
  const q = document.getElementById('q').value.trim();
  const estado = document.getElementById('estado').value;
  const url = `../backend_admin/get_users.php?q=${encodeURIComponent(q)}&estado=${encodeURIComponent(estado)}`;
  const resp = await fetch(url);
  const data = await resp.json();
  const tbody = document.getElementById('tbody'); tbody.innerHTML='';
  if (!data.success) return;
  data.users.forEach(u=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${u.id}</td><td>${u.nombre} ${u.apellidos||''}</td><td>${u.email}</td><td>${u.telefono||''}</td><td>${u.fecha_registro}</td><td>${u.activo===0?'<span class="badge bg-danger">No</span>':'<span class="badge bg-success">Sí</span>'}</td><td><button class="btn btn-sm btn-info me-1" data-id="${u.id}" onclick="ver(${u.id})">Ver</button><button class="btn btn-sm btn-warning" onclick="toggle(${u.id}, ${u.activo===0?1:0})">${u.activo===0?'Activar':'Desactivar'}</button></td>`;
    tbody.appendChild(tr);
  });
}

async function ver(id){
  const resp = await fetch(`../backend_admin/get_user.php?id=${id}`);
  const d = await resp.json();
  if (!d.success) return alert('Usuario no encontrado');
  const u = d.user;
  document.getElementById('modal-body').innerHTML = `<p><strong>Nombre:</strong> ${u.nombre} ${u.apellidos||''}</p><p><strong>Email:</strong> ${u.email}</p><p><strong>Tel:</strong> ${u.telefono||'—'}</p><p><strong>Dirección:</strong> ${u.direccion||'—'}</p><p><strong>Registrado:</strong> ${u.fecha_registro}</p><p><strong>Activo:</strong> ${u.activo? 'Sí' : 'No'}</p>`;
  new bootstrap.Modal(document.getElementById('modalUser')).show();
}

async function toggle(id, nuevo){
  if (!confirm('Confirmar cambio de estado')) return;
  const resp = await fetch('../backend_admin/update_user.php', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,activo:nuevo})});
  const d = await resp.json();
  if (d.success) { alert('Estado actualizado'); cargar(); } else { alert(d.error||'Error'); }
}

document.getElementById('btn-buscar').addEventListener('click', cargar);
window.addEventListener('load', cargar);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
