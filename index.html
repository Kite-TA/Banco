<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Banco Lupita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
        .admin-link { position: absolute; top: 16px; right: 16px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 position-relative">
    <a href="admin.html" class="btn btn-sm btn-outline-secondary admin-link">Acceso admin</a>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-header bg-white text-center py-3">
                        <h3 class="mb-0">Banca en Línea</h3>
                        <p class="text-muted">Ingresa tus credenciales</p>
                    </div>
                    <div class="card-body p-4">
                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
                        </form>
                        <div class="text-center mt-3">
                            <small class="text-muted">¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></small>
                        </div>
                    </div>
                </div>
                <div id="mensaje" class="mt-3"></div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const mensajeDiv = document.getElementById('mensaje');
            try {
                const respuesta = await fetch('backend_login/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const datos = await respuesta.json();
                if (respuesta.ok) {
                    localStorage.setItem('usuarioId', datos.usuarioId);
                    localStorage.setItem('nombre', datos.nombre);
                    localStorage.setItem('numeroCuenta', datos.numeroCuenta);
                    localStorage.setItem('saldo', datos.saldo);
                    localStorage.setItem('cuentaId', datos.cuentaId);
                    mensajeDiv.innerHTML = `<div class="alert alert-success">${datos.mensaje}</div>`;
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
                } else {
                    mensajeDiv.innerHTML = `<div class="alert alert-danger">${datos.error}</div>`;
                }
            } catch (error) {
                console.error('Error:', error);
                mensajeDiv.innerHTML = `<div class="alert alert-danger">Error de conexión con el servidor</div>`;
            }
        });
    </script>
</body>
</html>
